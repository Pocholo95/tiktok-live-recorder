<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TikTok Live Recorder Hub{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  {% set path = request.url.path %}
  <nav class="nav">
    <a href="/" class="{{ 'active' if path == '/' }}">Dashboard</a>
    <a href="/library" class="{{ 'active' if path.startswith('/library') }}">Biblioteca</a>
    <a href="/creators" class="{{ 'active' if path.startswith('/creators') }}">Creadores</a>
    <a href="/settings" class="{{ 'active' if path.startswith('/settings') }}">Ajustes</a>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
