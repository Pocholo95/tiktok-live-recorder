services:
  tiktok-hub:
    build: .
    command: ["serve"]
    ports:
      - "8000:8000"
    volumes:
      - ./output:/output
      # Not :ro - the /settings page writes to these when you save
      # credentials from the browser.
      - ./src/cookies.json:/app/cookies.json
      - ./src/telegram.json:/app/telegram.json
    environment:
      - OUTPUT_DIR=/output
    # Caps how much CPU the container can use at once. Recording is only a
    # container remux (FLV -> TS, no transcode), so this rarely matters.
    # Override without editing this file: HUB_CPUS=3 docker compose up, or
    # set it in a .env file next to this one (see .env.example).
    cpus: "${HUB_CPUS:-1.5}"
    restart: unless-stopped
    # Gives recordings in progress time to flush and close their .ts file
    # before Docker sends SIGKILL.
    stop_grace_period: 60s
