{% extends "base.html" %}
{% block title %}Biblioteca - TikTok Live Recorder Hub{% endblock %}
{% block container_class %} container-wide{% endblock %}
{% block content %}
<link rel="stylesheet" href="/static/nouislider.min.css">
<script src="/static/nouislider.min.js"></script>

{% include "partials/library_content.html" %}

<script>
// A recording click only swaps #library-main (to keep the sidebar's scroll
// position untouched), so the sidebar's own "active" class is stale until
// the next full sidebar re-render (page load or filter change). Update it
// immediately here instead of waiting on the server.
document.addEventListener("click", (e) => {
  const item = e.target.closest(".rec-item");
  if (!item) return;
  document.querySelectorAll(".rec-item.active").forEach((el) => {
    el.classList.remove("active");
  });
  item.classList.add("active");
});

// One-line convert commands (batch bar + each raw recording). They all use
// the same options, remembered per browser; changing them re-renders every
// command and tells the manual ffmpeg panel to refresh too.
(function () {
  const KEY = "convert-cmd-options";
  const DEFAULTS = {{ convert_defaults | tojson }};
  function load() {
    try { return { ...DEFAULTS, ...JSON.parse(localStorage.getItem(KEY) || "{}") }; }
    catch (e) { return { ...DEFAULTS }; }
  }
  function save(o) { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) { /* ignore */ } }

  window.convertOptions = load;
  function render() {
    const o = load();
    document.querySelectorAll("[data-convert-opt]").forEach((s) => { s.value = o[s.dataset.convertOpt]; });
    const origin = location.origin;
    document.querySelectorAll("[data-convert-cmd]").forEach((el) => {
      const ids = el.dataset.ids ? ` -Id ${el.dataset.ids}` : "";
      el.textContent =
        `& ([scriptblock]::Create((irm "${origin}/tools/convert-pending.ps1?inline=1"))) ` +
        `-Hub ${origin} -Encoder ${o.encoder} -Size ${o.size} -Quality ${o.quality}${ids}`;
    });
  }
  document.addEventListener("change", (e) => {
    const s = e.target.closest("[data-convert-opt]");
    if (!s) return;
    save({ ...load(), [s.dataset.convertOpt]: s.value });
    render();
    document.dispatchEvent(new CustomEvent("convert-options-changed"));
  });
  document.addEventListener("click", (e) => {
    const button = e.target.closest("[data-copy-cmd]");
    if (!button) return;
    const scope = button.closest("[data-convert-scope]") || button.parentElement;
    const code = scope.querySelector("[data-convert-cmd]");
    const label = button.dataset.label || button.textContent;
    button.dataset.label = label;
    navigator.clipboard.writeText(code.textContent).then(() => {
      button.textContent = "¡Copiado!";
      setTimeout(() => { button.textContent = label; }, 1500);
    });
  });
  document.addEventListener("DOMContentLoaded", render);
  document.addEventListener("htmx:afterSettle", render);
  render();
})();

// Video first: size the player to the space left below it, so the whole
// video (and its "En pantalla" bar) fits without scrolling.
(function () {
  function fit() {
    const video = document.getElementById("clip-video");
    if (!video) return;
    const top = video.getBoundingClientRect().top + window.scrollY;
    const bar = document.getElementById("on-screen");
    const below = (bar ? bar.offsetHeight : 0) + 16;
    const room = window.innerHeight - Math.max(0, top - window.scrollY) - below;
    video.style.maxHeight = Math.max(320, Math.round(room)) + "px";
  }
  window.addEventListener("resize", fit);
  document.addEventListener("htmx:afterSettle", (e) => {
    fit();
    // On phones the list sits below the video: bring the chosen one into view.
    const main = document.getElementById("library-main");
    if (window.innerWidth <= 900 && main && e.target && e.target.id === "library-main") {
      main.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  });
  document.addEventListener("DOMContentLoaded", fit);
  fit();
})();

// "▶ Ir" next to each guest: jump the player to when they joined.
document.addEventListener("click", (e) => {
  const button = e.target.closest("[data-seek]");
  if (!button) return;
  const video = document.getElementById("clip-video");
  if (!video) return;
  video.currentTime = parseFloat(button.dataset.seek) || 0;
  video.play();
  video.scrollIntoView({ behavior: "smooth", block: "center" });
});

// "Sin clips" view: delete every listed recording without clips. Two
// clicks (button, then "Sí, eliminar N"), and the server re-checks each one.
document.addEventListener("click", (e) => {
  const box = e.target.closest("#cleanup");
  if (!box) return;
  const confirmEl = box.querySelector(".cleanup-confirm");
  const start = box.querySelector(".cleanup-start");
  const statusEl = box.querySelector(".cleanup-status");
  if (e.target.closest("[data-cleanup-cancel]")) {
    confirmEl.hidden = true;
    start.hidden = false;
    return;
  }
  const step = e.target.closest("[data-cleanup-step]");
  if (!step) return;
  if (step.dataset.cleanupStep === "1") {
    start.hidden = true;
    confirmEl.hidden = false;
    return;
  }
  step.disabled = true;
  statusEl.className = "cleanup-status";
  statusEl.textContent = "Eliminando…";
  fetch("/recordings/delete-without-clips", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ids: JSON.parse(box.dataset.ids) }),
  })
    .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
    .then((result) => {
      let message = `Listo: ${result.deleted} eliminada${result.deleted === 1 ? "" : "s"}.`;
      if (result.kept) message += ` ${result.kept} se conservaron (ya tenían clips o cambiaron de estado).`;
      return htmx.ajax("GET", location.pathname + location.search, {
        target: "#library-content", swap: "outerHTML",
      }).then(() => {
        const fresh = document.querySelector("#cleanup .cleanup-status");
        if (fresh) fresh.textContent = message;
      });
    })
    .catch(() => {
      step.disabled = false;
      statusEl.className = "cleanup-status is-error";
      statusEl.textContent = "No se pudo completar. Recargá la página para ver qué quedó.";
    });
});

// Delete lives in the (htmx-swapped) recording header for every state, so
// handle it once here by delegation instead of per swapped-in script.
document.addEventListener("click", (e) => {
  const button = e.target.closest("[data-delete-recording]");
  if (!button) return;
  const id = button.dataset.deleteRecording;
  if (!confirm(`¿Eliminar esta grabación de @${button.dataset.username}? No se puede deshacer.`)) {
    return;
  }
  fetch(`/recordings/${id}`, { method: "DELETE" }).then((response) => {
    if (response.ok) window.location = "/library";
  });
});
</script>
{% endblock %}
