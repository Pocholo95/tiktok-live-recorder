<section class="panel player-panel">
  <video id="clip-video" controls preload="metadata" class="clip-video" poster="/media/{{ selected_recording.id }}/thumbnail">
    <source src="/media/{{ selected_recording.id }}" type="video/mp4">
  </video>
  {% if participants %}
  <div class="on-screen" id="on-screen"
    data-creator="{{ selected_recording.username }}"
    data-guests='{{ participants | tojson }}'>
    <span class="on-screen-label">En pantalla</span>
    <div class="on-screen-people" id="on-screen-people"></div>
  </div>
  {% endif %}
</section>

<section class="panel">
  <div class="panel-head">
    <h3>Cortar un clip</h3>
    <span class="muted kbd-hint"><kbd>I</kbd> marca inicio · <kbd>O</kbd> marca fin</span>
  </div>

  <div id="range-slider" class="range-slider"></div>

  <div class="clip-controls">
    <div class="time-field">
      <label for="clip-start">Inicio</label>
      <div class="time-input">
        <input type="text" id="clip-start" placeholder="00:00:00" class="mono">
        <button type="button" id="mark-start-btn" class="btn btn-ghost btn-small" title="Usa el tiempo actual del video (atajo: I)">Aquí</button>
      </div>
    </div>
    <div class="time-field">
      <label for="clip-end">Fin</label>
      <div class="time-input">
        <input type="text" id="clip-end" placeholder="00:00:00" class="mono">
        <button type="button" id="mark-end-btn" class="btn btn-ghost btn-small" title="Usa el tiempo actual del video (atajo: O)">Aquí</button>
      </div>
    </div>
    <div class="clip-actions">
      <button id="preview-btn" type="button" class="btn btn-ghost">▶ Previsualizar</button>
      <button id="download-btn" type="button" class="btn">Descargar clip</button>
    </div>
  </div>

  <form
    id="save-mark-form"
    hx-post="/recordings/{{ selected_recording.id }}/clip-marks"
    hx-target="#clip-marks-list"
    hx-swap="innerHTML"
    class="save-mark">
    <input type="text" name="label" placeholder="Nombre de la marca (opcional): gol, momento gracioso…" aria-label="Nombre de la marca">
    <button type="submit" class="btn btn-ghost">Guardar marca</button>
  </form>
  <p class="hint">El clip se corta al vuelo sin recodificar y se descarga directo; en el servidor solo queda guardado el rango si lo marcás.</p>
</section>

<section class="panel">
  <div class="panel-head"><h3>Marcas guardadas</h3></div>
  <div id="clip-marks-list" class="marks">
    {% include "partials/clip_marks.html" %}
  </div>
</section>

<script>
(function () {
  // "En pantalla": who was linked in with the creator at the current
  // playback time. Names come from recording_participants (seconds since
  // the recording started), so they follow seeking and scrubbing too.
  const bar = document.getElementById("on-screen");
  const video = document.getElementById("clip-video");
  if (!bar || !video) return;

  const creator = bar.dataset.creator;
  let guests = [];
  try { guests = JSON.parse(bar.dataset.guests || "[]"); } catch (e) { guests = []; }
  const people = document.getElementById("on-screen-people");

  // Same formula as web.formatting.avatar_hue, so colors match the rest.
  function hue(name) {
    let total = 0;
    for (let i = 0; i < name.length; i++) total += name.charCodeAt(i) * (i + 1);
    return total % 360;
  }

  function chip(name, isCreator) {
    const el = document.createElement("a");
    el.className = "on-screen-chip" + (isCreator ? " is-creator" : "");
    el.href = `https://www.tiktok.com/@${name}`;
    el.target = "_blank";
    el.rel = "noopener";
    const av = document.createElement("span");
    av.className = "avatar avatar-xs";
    av.style.setProperty("--hue", hue(name));
    av.textContent = name.charAt(0).toUpperCase();
    const img = document.createElement("img");
    img.src = `/avatars/${encodeURIComponent(name)}`;
    img.alt = "";
    img.onerror = () => img.remove();
    av.appendChild(img);
    el.appendChild(av);
    el.appendChild(document.createTextNode("@" + name));
    return el;
  }

  let shown = null;
  function update() {
    const t = video.currentTime || 0;
    const now = [];
    guests.forEach((g) => {
      const end = g.end_seconds == null ? Infinity : g.end_seconds;
      if (t >= g.start_seconds && t < end && !now.includes(g.username)) now.push(g.username);
    });
    const key = now.join(",");
    if (key === shown) return;
    shown = key;

    people.replaceChildren(chip(creator, true));
    if (now.length) {
      const sep = document.createElement("span");
      sep.className = "on-screen-with";
      sep.textContent = "con";
      people.appendChild(sep);
      now.forEach((name) => people.appendChild(chip(name, false)));
    } else {
      const solo = document.createElement("span");
      solo.className = "on-screen-with";
      solo.textContent = "sin invitados ahora";
      people.appendChild(solo);
    }
    document.querySelectorAll(".guest[data-guest]").forEach((li) => {
      const start = parseFloat(li.dataset.start);
      const end = li.dataset.end === "" ? Infinity : parseFloat(li.dataset.end);
      li.classList.toggle("is-now", t >= start && t < end);
    });
  }

  ["timeupdate", "seeked", "loadedmetadata"].forEach((ev) => video.addEventListener(ev, update));
  update();
})();

(function () {
  const video = document.getElementById("clip-video");
  const sliderEl = document.getElementById("range-slider");
  const startInput = document.getElementById("clip-start");
  const endInput = document.getElementById("clip-end");
  const recordingId = {{ selected_recording.id }};
  let slider = null;

  function formatHMS(totalSeconds) {
    totalSeconds = Math.max(0, totalSeconds || 0);
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = Math.floor(totalSeconds % 60);
    const pad = (n) => String(n).padStart(2, "0");
    return `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
  }

  function parseHMS(text) {
    const parts = String(text).split(":").map((p) => parseFloat(p));
    while (parts.length < 3) parts.unshift(0);
    const [hours, minutes, seconds] = parts.map((p) => (Number.isFinite(p) ? p : 0));
    return hours * 3600 + minutes * 60 + seconds;
  }

  function initSlider(duration) {
    const defaultEnd = Math.min(10, duration);
    noUiSlider.create(sliderEl, {
      start: [0, defaultEnd],
      connect: true,
      range: { min: 0, max: Math.max(duration, 0.1) },
      step: 0.1,
    });
    slider = sliderEl.noUiSlider;
    slider.on("update", (values) => {
      startInput.value = formatHMS(parseFloat(values[0]));
      endInput.value = formatHMS(parseFloat(values[1]));
    });
  }

  // A swapped-in video can finish loading metadata before this script even
  // runs (fast local files, or the element already sat in the browser's
  // cache from a previous visit) - a plain "loadedmetadata" listener would
  // then never fire, leaving the slider uninitialized. Check readyState
  // first and only wait for the event if metadata truly isn't there yet.
  if (video.readyState >= 1) {
    initSlider(video.duration);
  } else {
    video.addEventListener("loadedmetadata", () => {
      if (!slider) initSlider(video.duration);
    }, { once: true });
  }

  function syncSliderFromInputs() {
    if (slider) {
      slider.set([parseHMS(startInput.value), parseHMS(endInput.value)]);
    }
  }
  startInput.addEventListener("change", syncSliderFromInputs);
  endInput.addEventListener("change", syncSliderFromInputs);

  function previewRange(start, end) {
    video.currentTime = start;
    video.play();
    const onTimeUpdate = () => {
      if (video.currentTime >= end) {
        video.pause();
        video.removeEventListener("timeupdate", onTimeUpdate);
      }
    };
    video.addEventListener("timeupdate", onTimeUpdate);
  }
  // Exposed globally so the saved-marks list (re-rendered by htmx, outside
  // this closure) can call it from its own "Previsualizar" buttons, in
  // raw seconds (not HH:MM:SS).
  window.previewRange = previewRange;

  document.getElementById("preview-btn").addEventListener("click", () => {
    previewRange(parseHMS(startInput.value), parseHMS(endInput.value));
  });

  document.getElementById("download-btn").addEventListener("click", () => {
    const start = parseHMS(startInput.value);
    const end = parseHMS(endInput.value);
    window.location = `/media/${recordingId}/clip?start=${start}&end=${end}`;
  });

  // Inject start/end via htmx's own pre-request hook instead of writing to
  // hidden inputs on "submit" - that relied on this listener running
  // before htmx's own submit handler, which isn't guaranteed. configRequest
  // fires right as htmx builds the request, so this always wins.
  document.getElementById("save-mark-form").addEventListener("htmx:configRequest", (evt) => {
    evt.detail.parameters.start = parseHMS(startInput.value);
    evt.detail.parameters.end = parseHMS(endInput.value);
  });

  // Capture the video's current playback position into start/end - an
  // easier alternative to dragging the slider or typing a time by hand.
  function markStartHere() {
    startInput.value = formatHMS(video.currentTime);
    syncSliderFromInputs();
  }
  function markEndHere() {
    endInput.value = formatHMS(video.currentTime);
    syncSliderFromInputs();
  }
  document.getElementById("mark-start-btn").addEventListener("click", markStartHere);
  document.getElementById("mark-end-btn").addEventListener("click", markEndHere);

  document.addEventListener("keydown", (e) => {
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea") return;
    if (e.key === "i" || e.key === "I") markStartHere();
    if (e.key === "o" || e.key === "O") markEndHere();
  });
})();
</script>
