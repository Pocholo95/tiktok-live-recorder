{% extends "base.html" %}
{% block title %}Biblioteca - TikTok Live Recorder Hub{% endblock %}
{% block content %}
<link rel="stylesheet" href="/static/nouislider.min.css">
<script src="/static/nouislider.min.js"></script>

{% include "partials/library_content.html" %}

<script>
// A recording click only swaps #library-main (to keep the sidebar's scroll
// position untouched), so the sidebar's own "active" class is stale until
// the next full sidebar re-render (page load or filter change). Update it
// immediately here instead of waiting on the server.
document.addEventListener("click", (e) => {
  const item = e.target.closest(".rec-item");
  if (!item) return;
  document.querySelectorAll(".rec-item.active").forEach((el) => {
    el.classList.remove("active");
  });
  item.classList.add("active");
});

// One-line convert commands (batch bar + each raw recording). They all use
// the same options, remembered per browser; changing them re-renders every
// command and tells the manual ffmpeg panel to refresh too.
(function () {
  const KEY = "convert-cmd-options";
  const DEFAULTS = {{ convert_defaults | tojson }};
  function load() {
    try { return { ...DEFAULTS, ...JSON.parse(localStorage.getItem(KEY) || "{}") }; }
    catch (e) { return { ...DEFAULTS }; }
  }
  function save(o) { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) { /* ignore */ } }

  window.convertOptions = load;
  function render() {
    const o = load();
    document.querySelectorAll("[data-convert-opt]").forEach((s) => { s.value = o[s.dataset.convertOpt]; });
    const origin = location.origin;
    document.querySelectorAll("[data-convert-cmd]").forEach((el) => {
      const ids = el.dataset.ids ? ` -Id ${el.dataset.ids}` : "";
      el.textContent =
        `& ([scriptblock]::Create((irm "${origin}/tools/convert-pending.ps1?inline=1"))) ` +
        `-Hub ${origin} -Encoder ${o.encoder} -Size ${o.size} -Quality ${o.quality}${ids}`;
    });
  }
  document.addEventListener("change", (e) => {
    const s = e.target.closest("[data-convert-opt]");
    if (!s) return;
    save({ ...load(), [s.dataset.convertOpt]: s.value });
    render();
    document.dispatchEvent(new CustomEvent("convert-options-changed"));
  });
  document.addEventListener("click", (e) => {
    const button = e.target.closest("[data-copy-cmd]");
    if (!button) return;
    const code = button.parentElement.querySelector("[data-convert-cmd]");
    navigator.clipboard.writeText(code.textContent).then(() => {
      button.textContent = "¡Copiado!";
      setTimeout(() => { button.textContent = "Copiar"; }, 1500);
    });
  });
  document.addEventListener("DOMContentLoaded", render);
  document.addEventListener("htmx:afterSettle", render);
  render();
})();

// "▶ Ir" next to each guest: jump the player to when they joined.
document.addEventListener("click", (e) => {
  const button = e.target.closest("[data-seek]");
  if (!button) return;
  const video = document.getElementById("clip-video");
  if (!video) return;
  video.currentTime = parseFloat(button.dataset.seek) || 0;
  video.play();
  video.scrollIntoView({ behavior: "smooth", block: "center" });
});

// Delete lives in the (htmx-swapped) recording header for every state, so
// handle it once here by delegation instead of per swapped-in script.
document.addEventListener("click", (e) => {
  const button = e.target.closest("[data-delete-recording]");
  if (!button) return;
  const id = button.dataset.deleteRecording;
  if (!confirm(`¿Eliminar esta grabación de @${button.dataset.username}? No se puede deshacer.`)) {
    return;
  }
  fetch(`/recordings/${id}`, { method: "DELETE" }).then((response) => {
    if (response.ok) window.location = "/library";
  });
});
</script>
{% endblock %}
