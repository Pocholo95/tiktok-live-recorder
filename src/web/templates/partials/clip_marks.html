{% if error %}<p class="error-banner">{{ error }}</p>{% endif %}
{% for mark in marks %}
<div class="mark" id="clip-mark-{{ mark.id }}">
  <div class="mark-info">
    <strong>{{ mark.label or "Sin nombre" }}</strong>
    <span class="mono muted">{{ mark.start_seconds | hhmmss }} → {{ mark.end_seconds | hhmmss }}</span>
  </div>
  <div class="mark-actions">
    <button type="button" class="btn btn-ghost btn-small" onclick="previewRange({{ mark.start_seconds }}, {{ mark.end_seconds }})">▶ Ver</button>
    <a class="btn btn-ghost btn-small" href="/media/{{ recording_id or selected_recording.id }}/clip?start={{ mark.start_seconds }}&end={{ mark.end_seconds }}">Descargar</a>
    <button
      class="btn btn-danger btn-small"
      hx-delete="/clip-marks/{{ mark.id }}"
      hx-target="closest .mark"
      hx-swap="outerHTML">
      Eliminar
    </button>
  </div>
</div>
{% else %}
<p class="empty">Todavía no guardaste ninguna marca.</p>
{% endfor %}
